<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehndi Styles Portfolio | Shahi Henna</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins', sans-serif; background:#fffaf5; color:#3d2314; padding-top:140px; }
        
        .navbar { position:fixed; top:0; width:100%; z-index:1000; background:#4a2312; display:flex; justify-content:space-between; align-items:center; padding:1.2rem 4rem; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        .logo { color:#fcdfa9; font-family:'Playfair Display', serif; font-size:2rem; font-weight:700; text-decoration:none; }
        .nav-links { display:flex; gap:1.5rem; }
        .nav-links a { text-decoration:none; color:#fff; font-weight:500; padding:0.6rem 1.2rem; border-radius:20px; transition:0.3s; font-size:0.95rem; }
        .nav-links a:hover, .nav-links a.active { background:#fffaf5; color:#4a2312; }

        .title-section { text-align:center; margin-bottom:4rem; }
        .title-section h1 { font-family:'Playfair Display', serif; font-size:3rem; color:#4a2312; }

        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:2.5rem; padding:0 8% 5rem 8%; }
        .gallery-item { background:white; border-radius:20px; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,0.04); border:1px solid #f2e4d9; transition:0.3s; }
        .gallery-item:hover { transform:scale(1.02); }
        .gallery-item img { width:100%; height:360px; object-fit:cover; }
        .caption { padding:1.2rem; text-align:center; font-size:1.05rem; font-weight:600; color:#4a2312; background:#fffefc; }

        footer { background:#300c01; color:#fcdfa9; text-align:center; padding:2rem; }

        @media (max-width: 768px) {
            body { padding-top: 160px; }
            .navbar { padding: 1rem; flex-direction: column; gap: 0.8rem; }
            .logo { font-size: 1.6rem; }
            .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; gap: 0.4rem; }
            .nav-links a { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
            .title-section { margin-bottom: 2rem; }
            .title-section h1 { font-size: 2rem; }
            .gallery-grid { padding: 0 4% 3rem 4%; gap: 1.5rem; }
            .gallery-item img { height: 300px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">shahihennaholic</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cones.html">Cones & Storage</a>
            <a href="styles.html" class="active">Mehndi Styles</a>
            <a href="reviews.html">Reviews & Contact</a>
        </div>
    </nav>

    <div class="title-section">
        <h1>Our Design Catalog</h1>
    </div>

    <section class="gallery-grid">
        <div class="gallery-item"><img src="images/Bridal Mehandi designs.jpeg"><div class="caption">Bridal Design</div></div>
        <div class="gallery-item"><img src="images/Elbow length design front and back.jpeg"><div class="caption">Elbow Length Layout</div></div>
        <div class="gallery-item"><img src="images/Mandala design front and back.jpeg"><div class="caption">Mandala Design</div></div>
        <div class="gallery-item"><img src="images/Mid length design front and back.jpeg"><div class="caption">Mid Length Layout</div></div>
        <div class="gallery-item"><img src="images/Minimal design.jpeg"><div class="caption">Minimal Style</div></div>
        <div class="gallery-item"><img src="images/Palm length design front and back.jpeg"><div class="caption">Palm Length Style</div></div>
    </section>

    <footer>shahihennaholic • Premium Organic Mehndi Artistry</footer>
</body>
</html>
